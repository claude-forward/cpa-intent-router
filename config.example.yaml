# cpa-intent-router 插件配置文件示例
#
# 插件作为 CLIProxyAPI 内部 C ABI 动态库加载。小模型意图分类默认通过内部进程内 RPC
# (host.model.execute) 调用，无需配置任何外部 HTTP 地址或 API 密钥；也可在下方配置
# 外部 System One 决策模型分类器（Jev / Clef，POST /v1/systemone）以获得毫秒级判定。

# 是否启用意图路由插件（默认 true）
enabled: true

# 可选：如果希望将路由组配置与主配置隔离，可指定外部独立配置文件路径（支持 YAML / JSON）
# config_file: "groups.yaml"

# 可选：外部 System One 决策模型分类器（Jev / Clef 等，POST /v1/systemone）
# 配置后优先直连该端点判定意图；未配置或调用失败时自动回退到宿主内部 host.model.execute
# systemone:
#   type: "systemone"                        # 分类器类型，可省略（填写 endpoint/url 时默认 systemone）
#   endpoint: "https://api.typesafe.ai/v1/systemone"  # 完整服务地址，也可写为 url
#   api_key: "$TYPESAFE_API_KEY"             # 访问密钥，支持 $VAR / ${VAR} 环境变量展开
#   model: "jev"                             # 可选决策模型名，省略时使用组的 classifier 字段
#   timeout: "2s"                            # 可选单次请求超时，省略时默认 3s

# 虚拟路由组（Routing Groups）定义列表
groups:
  - id: "opus-anywhere"                       # 组唯一标识，客户端请求模型写为 "group/opus-anywhere" 或 "opus-anywhere"
    name: "Opus Anywhere 智能路由组"           # 组可读名称，自动注册到 /v1/models 显示
    members:                                  # 候选模型池列表，支持 "provider/model[:effort]" 或纯模型名
      - "openrouter/google/gemini-2.5-pro"
      - "deepseek-chat"
      - "claude/claude-3-7-sonnet"
    classifier: "gemini/gemini-2.5-flash"     # 前置意图分类小模型（当 rules 包含自然语言 intent 时由宿主内部调用判别）
    fallback: "claude/claude-3-7-sonnet"      # 兜底模型：当下方 rules 所有规则均未匹配命中时采用的分流目标

    # rules: 顺序分流匹配规则（分支路由规则链）
    # 【匹配机制与执行顺序】：
    # 1. 严格从上到下按顺序逐条评估，首条命中的规则直接生效并终止后续判断（First Match Wins）。
    # 2. 单条规则内部若定义了多个属性（如 tokens + images），必须全部满足才算命中（AND 逻辑）。
    # 3. 静态物理规则（推理深度、超长文本、图片附件、会话压缩等）优先在上方评估：零调用开销、零延迟命中直接分流。
    # 4. 自然语言意图规则（intent）位于静态规则之后、fallback 兜底之前：仅当前序静态条件均未命中时才惰性触发小模型判定。
    # 5. 模型定义同时支持两种写法：
    #    - 写法 A（显式指定 Provider，推荐）：如 "antigravity/claude-sonnet-4-6"、"codex/gpt-6.1-sol:high"
    #    - 写法 B（纯模型名，由插件动态查表推导）：如 "deepseek-flash"
    rules:
      # [规则 1] 深度推理分流：显式指定 Provider（codex）并要求 reasoning_effort=high
      - use: "codex/gpt-6.1-sol:high"
        effort: "high"

      # [规则 2] 超长上下文分流：显式指定 Provider（antigravity），估算 Token 数量 >= 200,000 时生效
      - use: "antigravity/gemini-3.8-flash-high"
        tokens: 200000

      # [规则 3] 多模态视觉分流：显式指定 Provider（codex），携带图片/文件附件时分流
      - use: "codex/gpt-6-luna"
        images: true

      # [规则 4] 会话压缩分流：纯模型名（插件自动解析宿主 openai-compatibility 映射），/compact 摘要
      - use: "deepseek-flash"
        compact: true

      # [规则 5] 时间窗口分流：仅在工作日下午时段（14:00 - 18:00，周一至周五）分流
      - use: "deepseek-flash"
        time:
          from: "14:00"
          to: "18:00"
          days: ["mon", "tue", "wed", "thu", "fri"]

      # [规则 6] 客户端 Agent 分流：显式指定 Provider（antigravity/claude-sonnet-4-6）
      - use: "antigravity/claude-sonnet-4-6"
        agents: ["claude", "codex"]

      # [规则 7] 自然语言意图分流（位于静态规则之后、fallback 兜底之前）：
      # 纯模型名 "deepseek-flash"，小模型判定为快速简单问答时分流
      - use: "deepseek-flash"
        intent: "a quick question or simple factual lookup"
